<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registro de gastos</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./config.js"></script>
    <style>
      :root {
        color-scheme: light;
        font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
        color: #172033;
        background: #edf1f5;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        padding: 24px;
      }

      main {
        width: min(100%, 960px);
        margin: 0 auto;
      }

      header {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        align-items: end;
        margin-bottom: 20px;
      }

      h1,
      h2 {
        margin: 0;
        line-height: 1.2;
      }

      h1 {
        font-size: 28px;
      }

      h2 {
        font-size: 18px;
      }

      .total {
        text-align: right;
      }

      .total strong {
        display: block;
        font-size: 28px;
      }

      .layout {
        display: grid;
        grid-template-columns: minmax(280px, 360px) 1fr;
        gap: 18px;
        align-items: start;
      }

      section {
        background: #ffffff;
        border: 1px solid #d4dde8;
        border-radius: 8px;
        padding: 18px;
        box-shadow: 0 10px 28px rgba(16, 24, 40, 0.08);
      }

      label {
        display: block;
        margin: 14px 0 6px;
        font-size: 14px;
        font-weight: 700;
      }

      input {
        width: 100%;
        min-height: 42px;
        border: 1px solid #aebdcb;
        border-radius: 6px;
        padding: 9px 11px;
        font: inherit;
        background: #ffffff;
      }

      button {
        min-height: 42px;
        border: 0;
        border-radius: 6px;
        padding: 0 14px;
        background: #1d4ed8;
        color: #ffffff;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }

      button:disabled {
        cursor: wait;
        opacity: 0.7;
      }

      .secondary {
        background: #e7edf5;
        color: #172033;
      }

      .danger {
        background: #fee2e2;
        color: #991b1b;
      }

      .actions {
        display: flex;
        gap: 10px;
        margin-top: 18px;
      }

      .actions button {
        flex: 1;
      }

      #status {
        min-height: 22px;
        margin: 14px 0 0;
        font-size: 14px;
      }

      .ok {
        color: #047857;
      }

      .error {
        color: #b91c1c;
      }

      .table-wrap {
        overflow-x: auto;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 12px;
      }

      th,
      td {
        padding: 10px 8px;
        border-bottom: 1px solid #e5eaf0;
        text-align: left;
        vertical-align: middle;
        white-space: nowrap;
      }

      th {
        color: #526173;
        font-size: 13px;
      }

      td:nth-child(4),
      th:nth-child(4) {
        text-align: right;
      }

      .empty {
        margin: 18px 0 0;
        color: #526173;
      }

      @media (max-width: 760px) {
        body {
          padding: 16px;
        }

        header,
        .layout {
          display: block;
        }

        .total {
          text-align: left;
          margin-top: 12px;
        }

        section + section {
          margin-top: 16px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div>
          <h1>Registro de gastos</h1>
        </div>
        <div class="total">
          Total cargado
          <strong id="total">$0</strong>
        </div>
      </header>

      <div class="layout">
        <section>
          <h2>Nuevo gasto</h2>

          <form id="expense-form">
            <label for="spent_at">Fecha</label>
            <input id="spent_at" name="spent_at" type="date" required />

            <label for="description">Descripcion</label>
            <input id="description" name="description" type="text" autocomplete="off" required />

            <label for="category">Categoria</label>
            <input id="category" name="category" type="text" autocomplete="off" required />

            <label for="amount">Monto</label>
            <input id="amount" name="amount" type="number" min="0" step="0.01" required />

            <div class="actions">
              <button id="submit-button" type="submit">Guardar</button>
              <button class="secondary" id="reload-button" type="button">Actualizar</button>
            </div>

            <p id="status" role="status" aria-live="polite"></p>
          </form>
        </section>

        <section>
          <h2>Ultimos movimientos</h2>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Fecha</th>
                  <th>Descripcion</th>
                  <th>Categoria</th>
                  <th>Monto</th>
                  <th></th>
                </tr>
              </thead>
              <tbody id="expenses"></tbody>
            </table>
          </div>
          <p class="empty" id="empty-state">Todavia no hay gastos cargados.</p>
        </section>
      </div>
    </main>

    <script>
      const form = document.getElementById("expense-form");
      const status = document.getElementById("status");
      const button = document.getElementById("submit-button");
      const reloadButton = document.getElementById("reload-button");
      const expensesBody = document.getElementById("expenses");
      const emptyState = document.getElementById("empty-state");
      const total = document.getElementById("total");
      const money = new Intl.NumberFormat("es-AR", {
        style: "currency",
        currency: "ARS",
      });

      const hasConfig =
        window.APP_CONFIG &&
        window.APP_CONFIG.supabaseUrl &&
        window.APP_CONFIG.supabaseAnonKey &&
        !window.APP_CONFIG.supabaseUrl.includes("TU-PROYECTO");
      const supabaseClient = hasConfig
        ? window.supabase.createClient(
            window.APP_CONFIG.supabaseUrl,
            window.APP_CONFIG.supabaseAnonKey
          )
        : null;

      function setStatus(message, type = "") {
        status.textContent = message;
        status.className = type;
      }

      function today() {
        return new Date().toISOString().slice(0, 10);
      }

      function renderExpenses(expenses) {
        expensesBody.innerHTML = "";
        emptyState.hidden = expenses.length > 0;

        const totalAmount = expenses.reduce((sum, expense) => sum + Number(expense.amount), 0);
        total.textContent = money.format(totalAmount);

        for (const expense of expenses) {
          const row = document.createElement("tr");
          const spentAt = document.createElement("td");
          const description = document.createElement("td");
          const category = document.createElement("td");
          const amount = document.createElement("td");
          const actions = document.createElement("td");
          const deleteButton = document.createElement("button");

          spentAt.textContent = expense.spent_at;
          description.textContent = expense.description;
          category.textContent = expense.category;
          amount.textContent = money.format(expense.amount);
          deleteButton.className = "danger";
          deleteButton.type = "button";
          deleteButton.dataset.id = expense.id;
          deleteButton.textContent = "Borrar";
          actions.appendChild(deleteButton);
          row.append(spentAt, description, category, amount, actions);
          expensesBody.appendChild(row);
        }
      }

      async function loadExpenses() {
        if (!supabaseClient) {
          setStatus("Falta crear config.js con las credenciales de Supabase.", "error");
          return;
        }

        const { data, error } = await supabaseClient
          .from("expenses")
          .select("id, spent_at, description, category, amount")
          .order("spent_at", { ascending: false })
          .order("created_at", { ascending: false })
          .limit(50);

        if (error) {
          setStatus(error.message, "error");
          return;
        }

        renderExpenses(data || []);
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();

        if (!supabaseClient) {
          setStatus("Falta crear config.js con las credenciales de Supabase.", "error");
          return;
        }

        const expense = {
          spent_at: form.spent_at.value,
          description: form.description.value.trim(),
          category: form.category.value.trim(),
          amount: Number(form.amount.value),
        };

        if (!expense.description || !expense.category || !expense.amount) {
          setStatus("Completa todos los campos.", "error");
          return;
        }

        button.disabled = true;
        setStatus("Guardando...");

        const { error } = await supabaseClient.from("expenses").insert(expense);

        button.disabled = false;

        if (error) {
          setStatus(error.message, "error");
          return;
        }

        setStatus("Gasto guardado.", "ok");
        form.reset();
        form.spent_at.value = today();
        form.description.focus();
        await loadExpenses();
      });

      expensesBody.addEventListener("click", async (event) => {
        const deleteButton = event.target.closest("button[data-id]");
        if (!deleteButton) return;

        deleteButton.disabled = true;
        const { error } = await supabaseClient
          .from("expenses")
          .delete()
          .eq("id", deleteButton.dataset.id);

        if (error) {
          setStatus(error.message, "error");
          deleteButton.disabled = false;
          return;
        }

        setStatus("Gasto borrado.", "ok");
        await loadExpenses();
      });

      reloadButton.addEventListener("click", loadExpenses);

      form.spent_at.value = today();
      loadExpenses();
    </script>
  </body>
</html>
